apiVersion: v1
kind: Namespace
metadata:
  name: basket-api
  labels:
    name: basket-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: basket-api-sa
  namespace: basket-api
  annotations:
    azure.workload.identity/client-id: "952f78ef-2dca-45c0-a368-9b521aa7e329"

---

apiVersion: v1
kind: Secret
metadata:
  name: basket-redis-secret
  namespace: basket-api
type: Opaque
stringData:
  ConnectionStrings__redis : "kaseyabasketredis.redis.cache.windows.net:6380,password=XbOvhO-ij-zfaY5LVhliHMnHbNXHy5F8YAZCAIWBPro=,ssl=True,abortConnect=False"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: basket-api
  namespace: basket-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: basket-api
  template:
    metadata:
      labels:
        app: basket-api
        azure.workload.identity/use: "true"

  # The workload identity annotation above is required to enable the workload identity feature for this deployment. The value of the annotation must be set to "true" to indicate that the workload identity feature should be enabled for this deployment.
  # Refereed the Service Account created in basket-api-service-account.yaml file to use workload identity feature.      
    spec:
      serviceAccountName: basket-api-sa
      containers:
        - name: basket-api
          image: acrkaseyaeshop.azurecr.io/basket-api:latest
          ports:
            - containerPort: 8080

          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ConnectionStrings__EventBus
              value: "svsbus-kaseyaeShop.servicebus.windows.net"
            - name: AZURE_CLIENT_ID
              value: "952f78ef-2dca-45c0-a368-9b521aa7e329"
            - name: Identity__Url
              value: "https://placeholder-identity-api-not-deployed-yet"  
          envFrom:
            - secretRef:
                name: basket-redis-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
---

apiVersion: v1
kind: Service
metadata:
  name: basket-api
  namespace: basket-api
  #annotations:
    # Gives this LoadBalancer a private IP from the AKS subnet only — no public IP at all.
    # Required so APIM's outbound VNet integration can route to it; a ClusterIP is only
    # reachable inside the AKS pod network, not from other subnets in the same VNet.
   # service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: basket-api
  ports:
    - port: 80
      targetPort: 8080
---