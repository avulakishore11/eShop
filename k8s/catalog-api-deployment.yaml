apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
        azure.workload.identity/use: "true"

  # The workload identity annotation above is required to enable the workload identity feature for this deployment. The value of the annotation must be set to "true" to indicate that the workload identity feature should be enabled for this deployment.
  # Refereed the Service Account created in catalog-api-service-account.yaml file to use workload identity feature.      
    spec:
      serviceAccountName: catalog-api-sa
      containers:
        - name: catalog-api
          image: acrkaseyaeshop.azurecr.io/catalog-api:latest
          ports:
            - containerPort: 8080

          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ConnectionStrings__EventBus
              value: "svsbus-kaseyaeShop.servicebus.windows.net"
            - name: AZURE_CLIENT_ID
              value: "6f73886f-0264-4c8b-808d-41ae096a4657"
          envFrom:
            - secretRef:
                name: catalog-db-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
---

apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: catalog
  annotations:
    # Gives this LoadBalancer a private IP from the AKS subnet only — no public IP at all.
    # Required so APIM's outbound VNet integration can route to it; a ClusterIP is only
    # reachable inside the AKS pod network, not from other subnets in the same VNet.
    #service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: catalog-api
  ports:
    - port: 80
      targetPort: 8080